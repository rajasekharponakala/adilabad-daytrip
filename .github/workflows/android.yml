name: Android APK
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths: ['android/**', 'scripts/**', 'src/**', 'public/**', 'index.html', 'package*.json', 'vite.config.js', '.github/workflows/android.yml']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci && npm test && npm run build
      - run: ./gradlew --stacktrace :app:assembleDebug :app:assembleDebugAndroidTest
        working-directory: android
      - name: Verify and name installable pilot APK
        run: |
          mkdir android-download
          cp android/app/build/outputs/apk/debug/app-debug.apk android-download/fieldday-india-android.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose android-download/fieldday-india-android.apk
          cd android-download && sha256sum fieldday-india-android.apk > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: fieldday-india-android
          path: android-download/
          if-no-files-found: error
      - name: Allow Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise offline screens on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: cd android && ./gradlew :app:connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-device-test-results
          path: android/app/build/reports/androidTests/connected/
          if-no-files-found: ignore
